name: Supabase keepalive

"on":
  schedule:
    # Every 3 days at 06:00 UTC — well inside Supabase's 7-day inactivity window.
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only ping to Supabase (SELECT id LIMIT 1)
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" \
            "https://zzilsernfsymlpzvajkc.supabase.co/rest/v1/materials?select=id&limit=1" \
            -H "apikey: sb_publishable_79Dh3acmslYiBSUyZ9LQBQ_5GGmBS0G" \
            -H "Authorization: Bearer sb_publishable_79Dh3acmslYiBSUyZ9LQBQ_5GGmBS0G"
